# Builds the web version of Pink Lane with pygbag and publishes it to GitHub Pages
# every time you push to main. You can also run it by hand from the Actions tab.
name: Deploy Pink Lane to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, only the newest build gets published.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pygbag==0.9.3   # the version tested locally
      # web/ holds the Pink Lane loading page and tab icon; 960x640 is the game's size.
      - run: python -m pygbag --build --template web/pink-lane.tmpl --icon web/favicon.png --width 960 --height 640 .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
